services:

  server:
    container_name: server
    image: server:1.0
    networks:
    - _network
    build:
      context: srcs/server
      dockerfile: Dockerfile
    env_file:
    - .env
    restart: unless-stopped
    expose:
    - "9001"

  client:
    container_name: client
    image: client:1.0
    networks:
    - _network
    build:
      context: srcs/client
      dockerfile: Dockerfile
    depends_on:
    - server
    restart: unless-stopped
    ports:
    - "8080:8080"

