user www-data;

events {
    worker_connections 768;
}

http {

    server{
        listen 0.0.0.0:8080 ssl;

        server_name localhost;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        root    /var/www/html/;
        index   index.html;

        location /api {
            proxy_pass http://server:9001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300;
            
        }

        # # Serve static files directly
        # location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico)$ {
        #     try_files $uri =404;
        #     expires 30d;
        #     add_header Cache-Control "public";
        # }

        # # API proxy to Go/Node backend (service "server" on port 9001)
        # location /api/ {
        #     proxy_pass http://server:9001/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # # SPA fallback to index.html (or index.php if using server-side rendering)
        # location / {
        #     try_files $uri $uri/ /index.html;
        # }

        # # PHP handling (if using .php files in public)
        # location ~ \.php$ {
        #     include fastcgi_params;
        #     fastcgi_pass php-fpm:9000;
        #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # }

    }

    include /etc/nginx/mime.types;
	default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

}